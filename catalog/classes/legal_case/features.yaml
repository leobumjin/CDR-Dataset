class_id: legal_case
features:
  legal_case_f_001:
    name: caused_property_damage
    description: The person damaged the property.
  legal_case_f_002:
    name: intentional_damage
    description: The damage was intentional.
  legal_case_f_003:
    name: property_belongs_to_another
    description: The damaged property belongs to another person.
  legal_case_f_004:
    name: has_owner_consent
    description: The owner consented to this damage.
  legal_case_f_005:
    name: necessary_to_prevent_imminent_harm
    description: In the emergency context, the damage was solely necessary to prevent the stipulated imminent
      serious danger; this fact does not establish an emergency in other contexts.
  legal_case_f_006:
    name: has_lawful_authorisation
    description: Lawful authorisation is present. Official-duty exemption separately requires necessary
      damage within the authorised scope; authorisation alone does not establish exemption.
  legal_case_f_007:
    name: within_official_scope
    description: The damage was necessary and within the authorised scope of the official duties assessed
      in the official-duty context.
